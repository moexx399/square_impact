name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please check the [known limits](https://github.com/moexx399/square_impact#known-limits)
        and existing issues first. **Security problems: don't file them here, see SECURITY.md.**
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Which command?
      options: [obs, live, shot, view, status, sample, grab, impact, version, other]
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How are you running it?
      options: [square_impact.exe (release), square_impact.exe (built myself), python square_impact.py]
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: Output of `square_impact version`
      render: text
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Output of `square_impact status`
      description: Shows which camera board you're connected to and its frame layout.
      render: text
  - type: dropdown
    id: shot
    attributes:
      label: Shot type (if capture-related)
      options: [not shot-related, putt, chip, half swing, full swing, other]
  - type: textarea
    id: log
    attributes:
      label: Console output / traceback
      description: Everything the terminal printed around the problem.
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, a sheet_cam0.png from the shot folder, OBS version, Windows version...
