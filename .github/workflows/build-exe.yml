# Builds square_impact.exe: a single Windows executable with adb bundled.
#   - every push / pull request: build + smoke test, exe uploaded as a workflow artifact
#   - version tags (v1.2.3 or 1.2.3): also published as a GitHub Release, with notes
#     from changie (.changes/v1.2.3.md)
name: build-exe

on:
  push:
    branches: [main, master]
    tags: ["v*", "[0-9]*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to create the release on tags

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Check tag matches the version in the code
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''   # the leading v is optional: v1.2.3 == 1.2.3
          $code = (Select-String -Path square_impact.py -Pattern '^VERSION = "(.*)"').Matches[0].Groups[1].Value
          if ($version -ne $code) { Write-Error "tag $tag does not match VERSION $code (run 'changie batch' first)"; exit 1 }
          # changie always names version notes with a v prefix
          if (-not (Test-Path ".changes/v$version.md")) { Write-Error "missing .changes/v$version.md (run 'changie batch')"; exit 1 }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Download adb (Android SDK platform-tools)
        shell: pwsh
        run: |
          Invoke-WebRequest https://dl.google.com/android/repository/platform-tools-latest-windows.zip -OutFile platform-tools.zip
          Expand-Archive platform-tools.zip -DestinationPath .
          Get-Content platform-tools/source.properties
          New-Item -ItemType Directory adb | Out-Null
          # adb.exe needs its two DLLs beside it; NOTICE.txt carries the licenses
          Copy-Item platform-tools/adb.exe, platform-tools/AdbWinApi.dll, platform-tools/AdbWinUsbApi.dll, platform-tools/NOTICE.txt adb/

      - name: Build exe
        shell: pwsh
        run: pyinstaller --onefile --console --name square_impact --add-data "adb;adb" square_impact.py

      - name: Smoke test (runs the bundled adb, no device needed)
        shell: pwsh
        run: |
          ./dist/square_impact.exe version
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory release | Out-Null
          Copy-Item dist/square_impact.exe, README.md, LICENSE, CHANGELOG.md release/
          Copy-Item adb/NOTICE.txt release/adb-NOTICE.txt
          Compress-Archive release/* square_impact-windows.zip

      - uses: actions/upload-artifact@v7
        with:
          name: square_impact-windows
          path: square_impact-windows.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          body_path: .changes/v${{ env.VERSION }}.md
          files: square_impact-windows.zip
