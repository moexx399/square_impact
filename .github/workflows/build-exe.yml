# Builds square_impact as a single executable with adb bundled, for Windows,
# macOS (Apple Silicon and Intel) and Linux.
#   - every push / pull request: build + smoke test on each platform, each zip
#     uploaded as a workflow artifact
#   - version tags (v1.2.3 or 1.2.3): also published together as one GitHub
#     Release, with notes from changie (.changes/v1.2.3.md)
# Asset names (square_impact-<platform>.zip) are what `square_impact update`
# looks for: see release_platform() in square_impact.py.
name: build-exe

on:
  push:
    branches: [main, master]
    tags: ["v*", "[0-9]*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to create the release on tags

jobs:
  build:
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: windows, tools: windows }
          - { os: macos-latest, platform: macos-arm64, tools: darwin }
          - { os: macos-15-intel, platform: macos-x64, tools: darwin }
          # the oldest supported Ubuntu: a binary built against an older glibc
          # also runs on newer distributions, not the other way round
          - { os: ubuntu-22.04, platform: linux-x64, tools: linux }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Check tag matches the version in the code
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="${GITHUB_REF_NAME#v}"   # the leading v is optional: v1.2.3 == 1.2.3
          # ask the code itself, so its formatting can't matter (a pattern once read nothing)
          # (no print(): on Windows its \r\n would leave a \r on the end)
          code=$(python -c "import square_impact, sys; sys.stdout.write(square_impact.VERSION)")
          if [ "$version" != "$code" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match VERSION $code (run 'changie batch' first)"; exit 1
          fi
          # changie always names version notes with a v prefix
          [ -f ".changes/v$version.md" ] || { echo "::error::missing .changes/v$version.md (run 'changie batch')"; exit 1; }

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Download adb (Android SDK platform-tools)
        run: |
          curl -fsSL -o platform-tools.zip \
            "https://dl.google.com/android/repository/platform-tools-latest-${{ matrix.tools }}.zip"
          python -c "import zipfile; zipfile.ZipFile('platform-tools.zip').extractall('.')"
          cat platform-tools/source.properties
          mkdir adb
          # NOTICE.txt carries the licenses; on Windows adb.exe needs its two DLLs beside it
          if [ "${{ matrix.platform }}" = windows ]; then
            cp platform-tools/adb.exe platform-tools/AdbWinApi.dll platform-tools/AdbWinUsbApi.dll adb/
          else
            cp platform-tools/adb adb/
          fi
          cp platform-tools/NOTICE.txt adb/

      - name: Build
        run: |
          icon=()
          if [ "${{ matrix.platform }}" = windows ]; then
            # the logo is drawn by square_impact.py itself, so there's no image file to keep in sync
            python -c "import square_impact as s; open('square_impact.ico', 'wb').write(s.logo_ico())"
            icon=(--icon square_impact.ico)
          fi
          pyinstaller --onefile --console --name square_impact "${icon[@]}" --add-data "adb:adb" square_impact.py

      - name: Smoke test (runs the bundled adb, no device needed)
        run: |
          exe=dist/square_impact; [ "${{ matrix.platform }}" = windows ] && exe=dist/square_impact.exe
          "$exe" --help > /dev/null
          "$exe" version

      - name: Package
        run: |
          python - <<'EOF'
          import os, zipfile
          plat = "${{ matrix.platform }}"
          exe = "square_impact.exe" if plat == "windows" else "square_impact"
          files = [(f"dist/{exe}", exe), ("README.md", "README.md"), ("LICENSE", "LICENSE"),
                   ("CHANGELOG.md", "CHANGELOG.md"), ("adb/NOTICE.txt", "adb-NOTICE.txt")]
          with zipfile.ZipFile(f"square_impact-{plat}.zip", "w", zipfile.ZIP_DEFLATED) as z:
              for src, name in files:
                  info = zipfile.ZipInfo.from_file(src, name)
                  if name == exe:
                      info.external_attr = 0o100755 << 16   # executable once unzipped on macOS/Linux
                  with open(src, "rb") as fh:
                      z.writestr(info, fh.read(), zipfile.ZIP_DEFLATED)
          print(f"square_impact-{plat}.zip")
          EOF

      - uses: actions/upload-artifact@v7
        with:
          name: square_impact-${{ matrix.platform }}
          path: square_impact-${{ matrix.platform }}.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Version from the tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v7
        with:
          pattern: square_impact-*
          merge-multiple: true
          path: release

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: .changes/v${{ env.VERSION }}.md
          files: release/square_impact-*.zip
          fail_on_unmatched_files: true
